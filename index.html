<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Equipos de Futbol</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="scoreboard" aria-label="Resumen de equipos">
        <div>
          <p class="eyebrow">Simulador</p>
          <h1>Equipos de futbol</h1>
        </div>

        <div class="score-grid">
          <article class="score-card team-a">
            <span>Equipo A</span>
            <strong id="teamATotal">0</strong>
          </article>
          <article class="score-card balance-card">
            <span>Diferencia</span>
            <strong id="differenceScore" class="diff good">0</strong>
          </article>
          <article class="score-card team-b">
            <span>Equipo B</span>
            <strong id="teamBTotal">0</strong>
          </article>
        </div>
      </section>

      <section class="workspace">
        <aside class="roster-panel" aria-label="Jugadores disponibles">
          <div class="panel-heading">
            <h2>Jugadores disponibles</h2>
            <button class="ghost-button" id="resetTeamsButton" type="button">Reiniciar</button>
          </div>
          <p class="hint">Arrastra cada tarjeta a un equipo. Tambien puedes usar los botones A, B o Banca.</p>
          <div id="benchPlayers" class="players-grid bench-grid drop-zone" data-team="bench"></div>
        </aside>

        <section class="pitch-wrap" aria-label="Cancha y equipos">
          <div class="pitch">
            <div class="pitch-lines">
              <div class="center-circle"></div>
              <div class="mid-line"></div>
              <div class="box box-left"></div>
              <div class="box box-right"></div>
              <div class="goal goal-left"></div>
              <div class="goal goal-right"></div>
            </div>

            <div class="team-zone left-zone drop-zone" data-team="A">
              <header>
                <h2>Equipo A</h2>
                <span id="teamACount">0 jugadores</span>
              </header>
              <div id="teamAPlayers" class="players-grid"></div>
            </div>

            <div class="team-zone right-zone drop-zone" data-team="B">
              <header>
                <h2>Equipo B</h2>
                <span id="teamBCount">0 jugadores</span>
              </header>
              <div id="teamBPlayers" class="players-grid"></div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <template id="playerCardTemplate">
      <article class="player-card" draggable="true">
        <div class="player-card-top">
          <div class="photo-slot">Foto</div>
          <div class="player-title">
            <h3></h3>
            <p></p>
          </div>
        </div>
        <dl class="attribute-list"></dl>
      </article>
    </template>

    <script src="script.js?v=4"></script>
  </body>
</html>
