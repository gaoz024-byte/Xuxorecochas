<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combos de Futbol</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="home-shell">
      <section class="home-hero" aria-labelledby="homeTitle">
        <p class="eyebrow">Simulador</p>
        <h1 id="homeTitle">Combos de Futbol</h1>
        <p class="home-copy">Crea equipos, guarda la formacion y vuelve a verla cuando quieras.</p>
        <a class="primary-link" href="combos.html">Crear combos</a>
      </section>

      <section class="saved-panel" aria-labelledby="savedTitle">
        <div class="panel-heading">
          <h2 id="savedTitle">Formaciones guardadas</h2>
          <button class="ghost-button hidden" id="clearFormationsButton" type="button">Borrar todo</button>
        </div>
        <div id="savedFormations" class="saved-list"></div>
      </section>
    </main>

    <script src="home.js"></script>
  </body>
</html>
